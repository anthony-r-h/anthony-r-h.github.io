; Named templates for this project. Source independently via CLABELTEMPLATES.
; {Item} is the visible item code; id is the stable internal CSV lookup key.
; Use \n to split lines. Column names are case-insensitive.

[detail]
template={Item}: {Description}\n(Qty {Count}, {Thickness})\n{Notes}

[compact]
template={Item} | {Description}

[ref]
template={Item}

[cutting]
template={Item}: {Description}\n{Thickness} | x{Count}

[notes]
template={Item}: {Notes}
